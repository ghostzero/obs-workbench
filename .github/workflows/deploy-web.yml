name: Deploy web edition

# Builds the web edition and publishes it to open.obs-workbench.com on every
# push to main. The Electron app is not built here.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through an upload.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # No postinstall and no Electron download: the web build needs neither.
      - name: Install
        run: yarn install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build
        run: yarn vite:build

      - name: Publish to open.obs-workbench.com
        run: scripts/deploy-web.sh dist
        env:
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST }}
          BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_PULL_ZONE_ID || '1855636' }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
